# Builds a ThinStation image on a GitHub runner, checks it, and publishes it.
#
# Run it from the Actions tab ("Build image" -> "Run workflow") or with
#   gh workflow run build-image.yml --ref thinpro -f version=v2
#
# GitHub only offers "Run workflow" for a file that also exists on the
# repository's default branch. Either make thinpro the default branch, or
# put a copy of this file on the default branch; the run then uses whichever
# branch is picked in the form.
#
# The build needs a Fedora 42 host, root, and the right to mount /proc, /sys
# and /dev inside a chroot, so everything runs in a privileged fedora:42
# container. The chroot alone is about 10 GB and the first-time install pulls
# several thousand RPMs, so expect roughly two hours per run.

name: Build image

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile under ts/build/conf/ to build"
        type: string
        default: thinpro
      version:
        description: "Label for the output file, e.g. v2 (blank = build-<run number>)"
        type: string
        default: ""
      session_type:
        description: "Override SESSION_0_TYPE, e.g. openbox or xfwm4 (blank = keep the profile's)"
        type: string
        default: ""
      extra_packages:
        description: "Extra packages to add, space separated"
        type: string
        default: ""
      build_options:
        description: "Extra options for ./build, e.g. --allmodules"
        type: string
        default: ""
      horizon_url:
        description: "URL of the Omnissa Horizon client RPM (not redistributable, so not in git). Blank = build without Horizon"
        type: string
        default: ""
      publish:
        description: "Where the image goes. Artifacts count against a 500 MB quota on free plans; releases do not."
        type: choice
        options: [artifact, release, none]
        default: artifact
      retention_days:
        description: "Days to keep the artifact (publish=artifact only)"
        type: number
        default: 5

permissions:
  contents: write            # only used by publish=release

concurrency:
  group: build-image-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    # Inputs reach the scripts only through the environment, never pasted
    # into them, so nothing typed into the form is executed as shell.
    env:
      PROFILE: ${{ inputs.profile }}
      VERSION: ${{ inputs.version }}
      SESSION_TYPE: ${{ inputs.session_type }}
      EXTRA_PACKAGES: ${{ inputs.extra_packages }}
      BUILD_OPTIONS: ${{ inputs.build_options }}
      HORIZON_URL: ${{ inputs.horizon_url }}
      PUBLISH: ${{ inputs.publish }}
      FEDORA: fedora:42

    steps:
      - name: Check inputs
        run: |
          fail() { echo "::error::$*"; exit 1; }
          echo "$PROFILE"        | grep -Eqx '[A-Za-z0-9._-]+'         || fail "profile: letters, digits, . _ - only"
          [ -z "$VERSION" ]      || echo "$VERSION" | grep -Eqx '[A-Za-z0-9._-]+' || fail "version: letters, digits, . _ - only"
          [ -z "$SESSION_TYPE" ] || echo "$SESSION_TYPE" | grep -Eqx '[A-Za-z0-9_-]+' || fail "session_type: letters, digits, _ - only"
          echo "$EXTRA_PACKAGES" | grep -Eqx '[A-Za-z0-9._+ -]*'       || fail "extra_packages: package names separated by spaces"
          echo "$BUILD_OPTIONS"  | grep -Eqx '[A-Za-z0-9._=/ -]*'      || fail "build_options: plain ./build flags only"
          [ -z "$HORIZON_URL" ]  || echo "$HORIZON_URL" | grep -Eqx 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' || fail "horizon_url: an http(s) URL"
          [ -n "$VERSION" ] || VERSION=build-$GITHUB_RUN_NUMBER
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$PROFILE-$VERSION" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          df -h / /mnt 2>/dev/null
          # Toolchains this job never uses; together they are 25-30 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache /usr/local/share/powershell \
                      /usr/share/swift /usr/local/julia* /opt/microsoft
          sudo docker image prune --all --force >/dev/null
          df -h / /mnt 2>/dev/null
          # Build wherever there is more room: / after the cleanup, or the
          # runner's temporary disk at /mnt when it has one.
          best=/; most=0
          for d in / /mnt; do
            [ -d "$d" ] || continue
            avail=$(df --output=avail -B1G "$d" | tail -1 | tr -d ' ')
            [ "$avail" -gt "$most" ] && { most=$avail; best=$d; }
          done
          echo "building on $best with ${most} GB free"
          [ "$most" -ge 30 ] || echo "::warning::only ${most} GB free; the build needs about 25 GB"
          echo "WORK=${best%/}/ts-work" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Prepare the tree
        run: |
          fail() { echo "::error::$*"; exit 1; }
          sudo mkdir -p "$WORK"
          sudo cp -a src/. "$WORK/"
          cd "$WORK/ts/build"

          [ -f "conf/$PROFILE/build.conf.example" ] || fail "no profile conf/$PROFILE"

          # build.conf is tracked as a link to ThinStation's own example,
          # not to this profile. Point it here explicitly; a checkout never will.
          sudo ln -sfn "conf/$PROFILE/build.conf.example" build.conf
          CONF="conf/$PROFILE/build.conf.example"

          for p in $EXTRA_PACKAGES; do
            [ -d "packages/$p" ] || fail "no package $p"
            grep -Eq "^[[:space:]]*package[[:space:]]+$p([[:space:]]|$)" "$CONF" \
              || echo "package $p" | sudo tee -a "$CONF" >/dev/null
          done

          if [ -n "$SESSION_TYPE" ]; then
            [ -d "packages/$SESSION_TYPE" ] || fail "no package provides session type $SESSION_TYPE"
            grep -Eq "^[[:space:]]*package[[:space:]]+$SESSION_TYPE([[:space:]]|$)" "$CONF" \
              || echo "package $SESSION_TYPE" | sudo tee -a "$CONF" >/dev/null
            # defaultconfig is relative to ts/build, not to the profile.
            DEFCONF=$(awk '$1=="param" && $2=="defaultconfig" {print $3}' "$CONF" | tail -1)
            [ -n "$DEFCONF" ] && [ -f "$DEFCONF" ] || fail "profile has no usable 'param defaultconfig'"
            printf '\n# set by the build-image workflow\nSESSION_0_TYPE=%s\n' "$SESSION_TYPE" \
              | sudo tee -a "$DEFCONF" >/dev/null
            echo "SESSION_0_TYPE=$SESSION_TYPE appended to $DEFCONF"
          fi

          # The Horizon client cannot live in git. With a URL the build fetches
          # it; without one the package is dropped, and so is horizon-client
          # from what verify-image expects.
          if grep -Eq '^[[:space:]]*package[[:space:]]+horizon([[:space:]]|$)' "$CONF"; then
            if [ -n "$HORIZON_URL" ]; then
              sudo sed -i "s|^[[:space:]]*param[[:space:]]\+horizonurl[[:space:]].*|param horizonurl     $HORIZON_URL|" "$CONF"
              echo "horizon: fetching the client from the given URL"
            else
              echo "::warning::no horizon_url given; building without the Omnissa Horizon client"
              sudo sed -i -E 's/^[[:space:]]*package[[:space:]]+horizon([[:space:]]|$)/#&/; s/^[[:space:]]*param[[:space:]]+horizonurl[[:space:]]/#&/' "$CONF"
              if [ -f "conf/$PROFILE/verify" ]; then
                sudo sed -i 's/ horizon-client//' "conf/$PROFILE/verify"
              fi
            fi
          fi

          echo "--- selected packages ---"
          grep -E '^[[:space:]]*package[[:space:]]' "$CONF" | awk '{print $2}' | tr '\n' ' '; echo

      - name: Compile the Qt programs
        run: |
          # The image ships whatever is in packages/*/bin; compile it from
          # this commit so the binaries cannot lag behind the source.
          sudo docker run --rm -v "$WORK/ts:/ts" "$FEDORA" bash -c '
            dnf -y -q install qt5-qtbase-devel gcc-c++ make binutils >/dev/null &&
            /ts/build/compile-qt'

      - name: Install the build chroot
        run: |
          sudo docker run --rm --privileged -v "$WORK:/thinstation" -w /thinstation "$FEDORA" bash -c '
            dnf -y -q install util-linux psmisc procps-ng findutils which \
                              tar xz cpio dbus-tools >/dev/null || exit 1
            # Not pipefail: yes dies of SIGPIPE (141) whenever setup-chroot
            # exits, so only the status of setup-chroot counts.
            yes Y | ./setup-chroot -i
            exit ${PIPESTATUS[1]}
          ' 2>&1 | sudo tee "$WORK/install.log" >/dev/null
          rc=${PIPESTATUS[0]}
          # The full log is thousands of lines of dnf; show the milestones.
          grep -E 'Complete|Error|error:|Failed' "$WORK/install.log" | tail -100 || true
          [ "$rc" -eq 0 ] || { echo "::error::chroot install failed ($rc), see install.log"; exit 1; }
          [ -d "$WORK/var/cache/dnf" ] || { echo "::error::chroot install left no var/cache/dnf"; exit 1; }

      - name: Build
        run: |
          sudo docker run --rm --privileged -v "$WORK:/thinstation" -w /thinstation \
            -e BUILD_OPTIONS "$FEDORA" bash -c '
            dnf -y -q install util-linux psmisc procps-ng findutils which >/dev/null || exit 1
            # See the install step: only the status of setup-chroot counts.
            if [ -n "$BUILD_OPTIONS" ]; then
              yes Y | ./setup-chroot -b -o $BUILD_OPTIONS
            else
              yes Y | ./setup-chroot -b
            fi
            exit ${PIPESTATUS[1]}
          ' 2>&1 | sudo tee "$WORK/build.log" | tail -60
          rc=${PIPESTATUS[0]}
          grep -q "Build Aborted" "$WORK/build.log" && { echo "::error::build aborted, see build.log"; exit 1; }
          [ "$rc" -eq 0 ] || { echo "::error::build exited with $rc, see build.log"; exit 1; }
          ISO="$WORK/ts/build/boot-images/grub/thinstation-efi.iso"
          [ -s "$ISO" ] || { echo "::error::no ISO was produced"; exit 1; }
          mkdir -p out
          cp "$ISO" "out/$IMAGE_NAME.iso"
          ls -l out

      - name: Verify the image
        run: |
          # Catches what a successful build does not: the wrong session, or a
          # session type with no /etc/init.d entry, which hangs the boot.
          args="--profile $PROFILE"
          [ -n "$SESSION_TYPE" ] && args="$args --expect-session $SESSION_TYPE"
          sudo docker run --rm -v "$WORK/ts/build:/b:ro" -v "$PWD/out:/out" "$FEDORA" bash -c "
            dnf -y -q install xorriso squashfs-tools cpio xz zstd >/dev/null &&
            bash /b/verify-image $args /out/$IMAGE_NAME.iso
          " | tee "out/$IMAGE_NAME.verify.txt"
          status=${PIPESTATUS[0]}
          {
            echo "### $IMAGE_NAME"
            echo '```'
            cat "out/$IMAGE_NAME.verify.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Checksums
        run: |
          cd out
          sha256sum "$IMAGE_NAME.iso" > "$IMAGE_NAME.iso.sha256"
          md5sum    "$IMAGE_NAME.iso" > "$IMAGE_NAME.iso.md5"
          cat "$IMAGE_NAME.iso.sha256" "$IMAGE_NAME.iso.md5"
          {
            echo
            echo '```'
            cat "$IMAGE_NAME.iso.sha256" "$IMAGE_NAME.iso.md5"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish as artifact
        if: inputs.publish == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: out/
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0          # the ISO is already compressed

      - name: Publish as release
        if: inputs.publish == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$IMAGE_NAME"
          {
            echo "Built from \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`."
            echo
            echo "| setting | value |"
            echo "|---|---|"
            echo "| profile | \`$PROFILE\` |"
            echo "| session override | \`${SESSION_TYPE:-none}\` |"
            echo "| extra packages | \`${EXTRA_PACKAGES:-none}\` |"
            echo "| build options | \`${BUILD_OPTIONS:-none}\` |"
            echo
            echo '```'
            cat "out/$IMAGE_NAME.verify.txt"
            echo '```'
          } > notes.md
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$IMAGE_NAME" --notes-file notes.md --prerelease
          fi

      - name: Keep the logs
        if: always()
        run: |
          mkdir -p logs
          for f in install.log build.log; do
            [ -f "$WORK/$f" ] && sudo cp "$WORK/$f" logs/
          done
          sudo chown -R "$(id -u)" logs 2>/dev/null
          ls -l logs 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
